<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet Colegio | Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <div class="header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREej7MO-xDcIavGIMNwM-a9tdInx2uN-ib-SMza49VBXuZnjZrfPOPc912&s=10" alt="Logo del centro educativo" class="logo">
            <h1>Centro Educativo Edwin Porras Ulloa</h1>
        </div>

        <div class="body">
            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="user">Usuario</label>
                    <input type="text" id="user" name="user" placeholder="Ingresa tu usuario" autocomplete="username">
                    <div class="error-msg">El usuario es obligatorio</div>
                </div>

                <div class="field">
                    <label for="pass">Contraseña</label>
                    <input type="password" id="pass" name="pass" placeholder="Ingresa tu contraseña" autocomplete="current-password">
                    <div class="error-msg">La contraseña es obligatoria</div>
                </div>

                <div class="roles" role="group" aria-label="Selecciona tu rol">
                    <button type="button" class="active" data-role="docente">Docente</button>
                    <button type="button" data-role="estudiante">Estudiante</button>
                    <button type="button" data-role="administrador">Administrador</button>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>

                <div class="msg-box" id="msgBox"></div>

                <div class="options">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

            <div class="footer">
                ¿No tienes cuenta? <a href="#">Contacta a la administración</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
